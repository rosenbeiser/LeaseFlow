spring:
  application:
    name: LeaseFlow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaseflow}
    username: ${DB_USERNAME:leaseflow}
    password: ${DB_PASSWORD:leaseflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: true

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ──────────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForLeaseFlowApplicationThatMustBeAtLeast256BitsLong}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  billing:
    electricity:
      tier1-limit: 100
      tier1-rate: 0.10
      tier2-limit: 300
      tier2-rate: 0.15
      tier3-rate: 0.25
    water:
      rate-per-unit: 1.50
      sewerage-charge: 5.00
    commercial:
      base-charge: 50.00
      rate-per-unit: 0.30
    late-fine-rate: 0.02

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.leaseflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

