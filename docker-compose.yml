services:
  leaseflow-db:
    image: postgres:16-alpine
    container_name: leaseflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaseflow}
      POSTGRES_USER: ${POSTGRES_USER:-leaseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaseflow_secret_pw}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - leaseflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaseflow} -d ${POSTGRES_DB:-leaseflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - leaseflow-net

  leaseflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaseflow-api
    restart: unless-stopped
    depends_on:
      leaseflow-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://leaseflow-db:5432/${POSTGRES_DB:-leaseflow}
      DB_USERNAME: ${POSTGRES_USER:-leaseflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-leaseflow_secret_pw}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:-ThisIsAVeryLongSecretKeyForLeaseFlowApplicationThatMustBeAtLeast256BitsLong}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - leaseflow-net

volumes:
  leaseflow-pgdata:
    name: leaseflow-pgdata

networks:
  leaseflow-net:
    name: leaseflow-net

